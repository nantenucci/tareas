<!DOCTYPE html>
<html lang="es" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Tareas — Antenucci Penal</title>
<link rel="icon" type="image/png" href="tareas-icon-512.png">
<link rel="shortcut icon" type="image/png" href="tareas-icon-512.png">
<link rel="apple-touch-icon" href="tareas-icon-192.png">
<meta name="theme-color" content="#1B3A6B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tareas">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --azul:#1B3A6B; --azul2:#2E5BA8; --azul-l:#EBF1FB;
  --gris:#F4F4F2; --gris2:#E8E8E4; --gris3:#9A9A96;
  --negro:#111110; --blanco:#FAFAF8; --borde:#D8D8D4;
  --rojo:#B3382C; --rojo-l:#FBEAE8;
  --naranja:#C97A1E; --naranja-l:#FBF0DF;
  --verde:#3D7A4E;
  --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
}
html,body{min-height:100%;background:var(--gris);font-family:var(--sans);color:var(--negro);font-size:14px}
body{translate:no}

.topbar{background:var(--azul);display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:2px solid var(--azul2);position:sticky;top:0;z-index:10}
.logo-cuervo{width:30px;height:30px;flex-shrink:0}
.topbar-brand{display:flex;flex-direction:column;line-height:1.15;flex:1}
.topbar-brand b{font-family:var(--mono);font-size:15px;font-weight:600;color:#fff;letter-spacing:.02em}
.topbar-brand span{font-size:11px;color:#8FB0DD}
.topbar-nav{display:flex;gap:6px}
.topbar-nav a{font-family:var(--mono);font-size:11.5px;color:#C7D8F0;text-decoration:none;padding:6px 10px;border-radius:6px;border:1px solid transparent}
.topbar-nav a:hover{background:rgba(255,255,255,.08)}
.topbar-nav a.activo{color:#fff;border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.08)}

.main{max-width:640px;margin:0 auto;padding:20px 16px 60px}

.card{background:#fff;border:1px solid var(--borde);border-radius:10px;padding:16px;margin-bottom:22px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.entrada textarea{width:100%;border:1px solid var(--borde);border-radius:7px;padding:11px 12px;font-family:var(--sans);font-size:14.5px;color:var(--negro);resize:vertical;min-height:64px;line-height:1.5}
.entrada textarea:focus{outline:none;border-color:var(--azul2);box-shadow:0 0 0 2px var(--azul-l)}
.entrada-acciones{display:flex;gap:8px;margin-top:10px}
.btn{font-family:var(--sans);font-size:13.5px;font-weight:600;border-radius:7px;padding:9px 16px;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:6px}
.btn-guardar{background:var(--azul);color:#fff;flex:1;justify-content:center}
.btn-guardar:hover{background:var(--azul2)}
.btn-guardar:disabled{opacity:.55;cursor:default}
.btn-mic{background:var(--gris);color:var(--azul);border:1px solid var(--borde);flex-shrink:0;width:42px;justify-content:center;font-size:16px}
.btn-mic.grabando{background:var(--rojo);color:#fff;border-color:var(--rojo)}
.hint{font-size:11.5px;color:var(--gris3);margin-top:8px}

.seccion{margin-bottom:18px}
.seccion-titulo{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--gris3);margin-bottom:8px;padding-left:2px}
.seccion.vencidas .seccion-titulo{color:var(--rojo)}
.seccion.hoy .seccion-titulo{color:var(--naranja)}

.tarea{background:#fff;border:1px solid var(--borde);border-radius:8px;padding:12px 14px;margin-bottom:7px;display:flex;align-items:flex-start;gap:11px}
.seccion.vencidas .tarea{border-left:3px solid var(--rojo)}
.seccion.hoy .tarea{border-left:3px solid var(--naranja)}
.chk{width:20px;height:20px;border-radius:50%;border:2px solid var(--borde);flex-shrink:0;cursor:pointer;margin-top:1px;display:flex;align-items:center;justify-content:center;background:#fff;font-size:12px;color:transparent}
.chk:hover{border-color:var(--azul2)}
.tarea-body{flex:1;min-width:0}
.tarea-titulo{font-size:14px;font-weight:500;color:var(--negro);line-height:1.4}
.tarea-desc{font-size:12.5px;color:#555;margin-top:2px;line-height:1.4}
.tarea-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.tarea-fecha{font-family:var(--mono);font-size:11px;color:var(--gris3);background:var(--gris);border-radius:4px;padding:2px 7px}
.seccion.vencidas .tarea-fecha{background:var(--rojo-l);color:var(--rojo)}
.seccion.hoy .tarea-fecha{background:var(--naranja-l);color:var(--naranja)}
.tarea-causa{font-size:11px;color:var(--azul2);background:var(--azul-l);border-radius:4px;padding:2px 7px}

.btn-editar{background:none;border:none;color:var(--gris3);cursor:pointer;font-size:14px;padding:2px 4px;border-radius:4px;flex-shrink:0;align-self:flex-start}
.btn-editar:hover{background:var(--gris);color:var(--azul2)}

.form-editar{display:flex;flex-direction:column;gap:8px;width:100%}
.form-editar input[type=text],.form-editar textarea{width:100%;border:1px solid var(--borde);border-radius:6px;padding:8px 10px;font-family:var(--sans);font-size:13.5px;color:var(--negro)}
.form-editar textarea{resize:vertical;min-height:44px;line-height:1.4}
.form-editar input:focus,.form-editar textarea:focus{outline:none;border-color:var(--azul2);box-shadow:0 0 0 2px var(--azul-l)}
.ed-fila{display:flex;gap:8px}
.ed-fila input{flex:1;border:1px solid var(--borde);border-radius:6px;padding:8px 10px;font-family:var(--mono);font-size:12.5px;color:var(--negro)}
.ed-causa-hint{font-size:11px;color:var(--gris3);min-height:14px}
.ed-acciones{display:flex;gap:8px}
.ed-acciones .btn{padding:7px 14px;font-size:12.5px}
.btn-guardar-ed{background:var(--azul);color:#fff}
.btn-guardar-ed:hover{background:var(--azul2)}
.btn-guardar-ed:disabled{opacity:.55}
.btn-cancelar-ed{background:var(--gris);color:var(--negro);border:1px solid var(--borde)}

.vacio{text-align:center;padding:50px 20px;color:var(--gris3);font-size:13px}
.vacio b{display:block;font-size:15px;color:var(--azul);margin-bottom:6px;font-family:var(--mono)}
.cargando{text-align:center;padding:30px;color:var(--gris3);font-size:12.5px}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--negro);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:50;max-width:90vw;text-align:center}
.toast.mostrar{opacity:1;transform:translateX(-50%) translateY(-4px)}
.toast.error{background:var(--rojo)}
</style>
</head>

<div class="main">
  <div class="card">
    <div class="entrada">
      <textarea id="txtEntrada" placeholder="Escribí o dictá una tarea… ej: presentar escrito en causa Pérez el viernes a las 10"></textarea>
      <div class="entrada-acciones">
        <button class="btn btn-mic" id="btnMic" title="Dictar por voz">&#127908;</button>
        <button class="btn btn-guardar" id="btnGuardar">Guardar</button>
      </div>
      <div class="hint" id="hint"></div>
    </div>
  </div>

  <div id="lista">
    <div class="cargando">Cargando…</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://dzbbswphrqgmdndtvxzx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_wTeNC3UmYjHsuTQ9LfCWkg_KJDz3C3B';
const WORKER_URL = 'https://nestor-asistente-tareas.nantenucci.workers.dev/api/interpretar';
const BUSCAR_CAUSA_URL = 'https://nestor-asistente-tareas.nantenucci.workers.dev/api/buscar-causa';

let tareasActuales = {};
let causasActuales = {};

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

const txtEntrada = document.getElementById('txtEntrada');
const btnGuardar = document.getElementById('btnGuardar');
const btnMic = document.getElementById('btnMic');
const lista = document.getElementById('lista');
const toastEl = document.getElementById('toast');
const hint = document.getElementById('hint');

function toast(msg, esError) {
  toastEl.textContent = msg;
  toastEl.className = 'toast mostrar' + (esError ? ' error' : '');
  setTimeout(() => { toastEl.className = 'toast'; }, 3200);
}

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function hoyART() {
  const d = new Date(Date.now() - 3 * 60 * 60 * 1000);
  return d.toISOString().slice(0, 10);
}

async function guardarTarea() {
  const texto = txtEntrada.value.trim();
  if (!texto) return;
  btnGuardar.disabled = true;
  btnGuardar.textContent = 'Guardando…';
  try {
    const resp = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ texto }),
    });
    const parsed = await resp.json();
    if (!resp.ok || parsed.error) throw new Error(parsed.error || 'No se pudo interpretar el texto');

    const { error } = await db.from('tareas').insert({
      texto_original: texto,
      titulo: parsed.titulo,
      descripcion: parsed.descripcion,
      fecha_vencimiento: parsed.fecha_vencimiento,
      hora_vencimiento: parsed.hora_vencimiento,
      causa_id: parsed.causa_id,
    });
    if (error) throw error;

    txtEntrada.value = '';
    toast('Tarea guardada &#9989;'.replace('&#9989;', '✅'));
    cargarTareas();
  } catch (e) {
    console.error(e);
    toast('Error al guardar: ' + (e.message || e), true);
  } finally {
    btnGuardar.disabled = false;
    btnGuardar.textContent = 'Guardar';
  }
}

async function marcarHecho(id, elChk) {
  elChk.textContent = '⋯';
  const { error } = await db.from('tareas').update({ estado: 'hecho' }).eq('id', id);
  if (error) {
    toast('No se pudo marcar como hecho', true);
    elChk.textContent = '';
    return;
  }
  cargarTareas();
}

function editarTarea(id) {
  const t = tareasActuales[id];
  const cont = document.getElementById('tarea-' + id);
  if (!t || !cont) return;

  const causaNombre = t.causa_id && causasActuales[t.causa_id] ? causasActuales[t.causa_id] : '';

  cont.innerHTML = `
    <div class="form-editar">
      <input type="text" class="ed-titulo" placeholder="Título" value="${escapeHtml(t.titulo || '')}">
      <textarea class="ed-desc" placeholder="Descripción (opcional)">${escapeHtml(t.descripcion || '')}</textarea>
      <div class="ed-fila">
        <input type="date" class="ed-fecha" value="${t.fecha_vencimiento || ''}">
        <input type="time" class="ed-hora" value="${t.hora_vencimiento ? t.hora_vencimiento.slice(0, 5) : ''}">
      </div>
      <input type="text" class="ed-causa" placeholder="Causa (imputado o carátula)" value="${escapeHtml(causaNombre)}">
      <div class="ed-causa-hint"></div>
      <div class="ed-acciones">
        <button class="btn btn-guardar-ed" onclick="guardarEdicion('${id}')">Guardar</button>
        <button class="btn btn-cancelar-ed" onclick="cargarTareas()">Cancelar</button>
      </div>
    </div>`;

  const inputCausa = cont.querySelector('.ed-causa');
  const hintCausa = cont.querySelector('.ed-causa-hint');
  inputCausa.dataset.causaId = t.causa_id || '';
  if (causaNombre) hintCausa.textContent = '🔗 ' + causaNombre;

  let debounceTimer;
  inputCausa.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    const valor = inputCausa.value.trim();
    inputCausa.dataset.causaId = '';
    if (!valor) { hintCausa.textContent = ''; return; }
    hintCausa.textContent = 'Buscando…';
    debounceTimer = setTimeout(async () => {
      try {
        const resp = await fetch(`${BUSCAR_CAUSA_URL}?q=${encodeURIComponent(valor)}`);
        const resData = await resp.json();
        if (resData.causa) {
          inputCausa.dataset.causaId = resData.causa.id;
          hintCausa.textContent = '🔗 ' + (resData.causa.imputado || resData.causa.caratula || '');
        } else {
          hintCausa.textContent = 'Sin causa vinculada';
        }
      } catch (e) {
        hintCausa.textContent = '';
      }
    }, 500);
  });
}

async function guardarEdicion(id) {
  const cont = document.getElementById('tarea-' + id);
  if (!cont) return;

  const titulo = cont.querySelector('.ed-titulo').value.trim();
  if (!titulo) { toast('El título no puede quedar vacío', true); return; }
  const descripcion = cont.querySelector('.ed-desc').value.trim() || null;
  const fecha_vencimiento = cont.querySelector('.ed-fecha').value || null;
  const hora_vencimiento = cont.querySelector('.ed-hora').value || null;
  const inputCausa = cont.querySelector('.ed-causa');
  const causa_id = inputCausa.value.trim() ? (inputCausa.dataset.causaId || null) : null;

  const btnG = cont.querySelector('.btn-guardar-ed');
  btnG.disabled = true;
  btnG.textContent = 'Guardando…';

  const { error } = await db
    .from('tareas')
    .update({ titulo, descripcion, fecha_vencimiento, hora_vencimiento, causa_id })
    .eq('id', id);

  if (error) {
    toast('No se pudo guardar: ' + error.message, true);
    btnG.disabled = false;
    btnG.textContent = 'Guardar';
    return;
  }

  toast('Tarea actualizada ✅');
  cargarTareas();
}

async function cargarTareas() {
  const { data, error } = await db
    .from('tareas')
    .select('id,titulo,descripcion,fecha_vencimiento,hora_vencimiento,causa_id')
    .eq('estado', 'pendiente')
    .order('fecha_vencimiento', { ascending: true, nullsFirst: false });

  if (error) {
    lista.innerHTML = '<div class="vacio">No se pudo cargar la lista.</div>';
    console.error(error);
    return;
  }

  if (!data || data.length === 0) {
    lista.innerHTML = '<div class="vacio"><b>Sin pendientes</b>Todo al día. 🎉</div>';
    return;
  }

  tareasActuales = {};
  data.forEach(t => { tareasActuales[t.id] = t; });

  const causaIds = [...new Set(data.filter(t => t.causa_id).map(t => t.causa_id))];
  let causas = {};
  if (causaIds.length) {
    const { data: cRows } = await db.from('causas').select('id,imputado,caratula').in('id', causaIds);
    (cRows || []).forEach(c => { causas[c.id] = c.imputado || c.caratula || ''; });
  }
  causasActuales = causas;

  const hoy = hoyART();
  const grupos = { vencidas: [], hoy: [], proximas: [], sinfecha: [] };
  data.forEach(t => {
    if (!t.fecha_vencimiento) grupos.sinfecha.push(t);
    else if (t.fecha_vencimiento < hoy) grupos.vencidas.push(t);
    else if (t.fecha_vencimiento === hoy) grupos.hoy.push(t);
    else grupos.proximas.push(t);
  });

  const nombres = { vencidas: 'Vencidas', hoy: 'Hoy', proximas: 'Próximas', sinfecha: 'Sin fecha' };
  let html = '';
  for (const key of ['vencidas', 'hoy', 'proximas', 'sinfecha']) {
    const items = grupos[key];
    if (!items.length) continue;
    html += `<div class="seccion ${key}"><div class="seccion-titulo">${nombres[key]} (${items.length})</div>`;
    items.forEach(t => {
      let metaFecha = '';
      if (t.fecha_vencimiento) {
        metaFecha = `<span class="tarea-fecha">${t.fecha_vencimiento}${t.hora_vencimiento ? ' ' + t.hora_vencimiento.slice(0,5) : ''}</span>`;
      }
      const metaCausa = t.causa_id && causas[t.causa_id] ? `<span class="tarea-causa">${escapeHtml(causas[t.causa_id])}</span>` : '';
      html += `
        <div class="tarea" id="tarea-${t.id}">
          <div class="chk" onclick="marcarHecho('${t.id}', this)"></div>
          <div class="tarea-body">
            <div class="tarea-titulo">${escapeHtml(t.titulo)}</div>
            ${t.descripcion ? `<div class="tarea-desc">${escapeHtml(t.descripcion)}</div>` : ''}
            ${metaFecha || metaCausa ? `<div class="tarea-meta">${metaFecha}${metaCausa}</div>` : ''}
          </div>
          <button class="btn-editar" onclick="editarTarea('${t.id}')" title="Editar">&#9998;</button>
        </div>`;
    });
    html += `</div>`;
  }
  lista.innerHTML = html;
}

btnGuardar.addEventListener('click', guardarTarea);
txtEntrada.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) guardarTarea();
});

// Dictado por voz
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
  const rec = new SpeechRecognition();
  rec.lang = 'es-AR';
  rec.interimResults = false;
  let grabando = false;

  btnMic.addEventListener('click', () => {
    if (grabando) { rec.stop(); return; }
    rec.start();
  });
  rec.addEventListener('start', () => {
    grabando = true;
    btnMic.classList.add('grabando');
    hint.textContent = 'Escuchando…';
  });
  rec.addEventListener('end', () => {
    grabando = false;
    btnMic.classList.remove('grabando');
    hint.textContent = '';
  });
  rec.addEventListener('result', (e) => {
    const transcript = e.results[0][0].transcript;
    txtEntrada.value = (txtEntrada.value.trim() + ' ' + transcript).trim();
  });
  rec.addEventListener('error', (e) => {
    if (e.error !== 'no-speech' && e.error !== 'aborted') toast('No se pudo grabar audio', true);
  });
} else {
  btnMic.disabled = true;
  btnMic.title = 'Dictado por voz no disponible en este navegador';
  btnMic.style.opacity = '.4';
}

cargarTareas();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
