<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --azul:#1B3A6B; --azul2:#2E5BA8; --azul-l:#EBF1FB;
  --gris:#F4F4F2; --gris2:#E8E8E4; --gris3:#9A9A96;
  --negro:#111110; --blanco:#FAFAF8; --borde:#D8D8D4;
  --rojo:#B3382C; --rojo-l:#FBEAE8;
  --naranja:#C97A1E; --naranja-l:#FBF0DF;
  --verde:#3D7A4E;
  --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
  --serif:'EB Garamond',Georgia,'Times New Roman',serif;
}
html,body{min-height:100%;background:var(--gris);font-family:var(--sans);color:var(--negro);font-size:14px}
body{translate:no}

.topbar{background:var(--azul);display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:2px solid var(--azul2);position:sticky;top:0;z-index:10}
.logo-cuervo{width:30px;height:30px;flex-shrink:0}
.topbar-brand{display:flex;flex-direction:column;line-height:1.15;flex:1}
.topbar-brand b{font-family:var(--mono);font-size:15px;font-weight:600;color:#fff;letter-spacing:.02em}
.topbar-brand span{font-size:11px;color:#8FB0DD}
.topbar-nav{display:flex;gap:6px}
.topbar-nav a{font-family:var(--mono);font-size:11.5px;color:#C7D8F0;text-decoration:none;padding:6px 10px;border-radius:6px;border:1px solid transparent}
.topbar-nav a:hover{background:rgba(255,255,255,.08)}
.topbar-nav a.activo{color:#fff;border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.08)}

.main{max-width:640px;margin:0 auto;padding:20px 16px 60px}

.card{background:#fff;border:1px solid var(--borde);border-radius:10px;padding:16px;margin-bottom:22px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card-titulo{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--gris3);margin-bottom:12px}

.campo{margin-bottom:12px}
.campo label{display:block;font-size:12px;font-weight:600;color:#444;margin-bottom:5px}
.campo input[type=text],.campo input[type=number],.campo input[type=date],.campo select,.campo textarea{
  width:100%;border:1px solid var(--borde);border-radius:7px;padding:9px 11px;font-family:var(--sans);font-size:13.5px;color:var(--negro);background:#fff;
}
.campo textarea{resize:vertical;min-height:60px;line-height:1.5}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:none;border-color:var(--azul2);box-shadow:0 0 0 2px var(--azul-l)}
.fila2{display:flex;gap:10px}
.fila2 .campo{flex:1}
.campo-hint{font-size:11px;color:var(--gris3);margin-top:4px}
.campo-hint.link{color:var(--azul2)}

.monto-letras{font-family:var(--mono);font-size:11.5px;color:var(--azul2);background:var(--azul-l);border-radius:6px;padding:8px 10px;margin-top:6px;line-height:1.5;min-height:16px}

.btn{font-family:var(--sans);font-size:13.5px;font-weight:600;border-radius:7px;padding:9px 16px;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:6px}
.btn-guardar{background:var(--azul);color:#fff;width:100%;justify-content:center;margin-top:4px}
.btn-guardar:hover{background:var(--azul2)}
.btn-guardar:disabled{opacity:.55;cursor:default}
.btn-sec{background:var(--gris);color:var(--negro);border:1px solid var(--borde)}
.btn-sec:hover{background:var(--gris2)}

.seccion-titulo{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--gris3);margin-bottom:8px;padding-left:2px}

.historial-item{background:#fff;border:1px solid var(--borde);border-radius:8px;padding:11px 13px;margin-bottom:7px;display:flex;align-items:center;gap:11px;cursor:pointer}
.historial-item:hover{border-color:var(--azul2)}
.historial-item.anulado{opacity:.55}
.hi-num{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--azul);background:var(--azul-l);border-radius:5px;padding:3px 7px;flex-shrink:0}
.hi-body{flex:1;min-width:0}
.hi-nombre{font-size:13.5px;font-weight:500}
.hi-meta{font-size:11.5px;color:var(--gris3);margin-top:1px}
.hi-monto{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--verde);flex-shrink:0}
.historial-item.anulado .hi-monto{color:var(--gris3);text-decoration:line-through}
.badge-anulado{font-size:9.5px;font-family:var(--mono);color:var(--rojo);background:var(--rojo-l);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:middle}

.vacio{text-align:center;padding:30px 20px;color:var(--gris3);font-size:13px}
.cargando{text-align:center;padding:20px;color:var(--gris3);font-size:12.5px}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--negro);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:50;max-width:90vw;text-align:center}
.toast.mostrar{opacity:1;transform:translateX(-50%) translateY(-4px)}
.toast.error{background:var(--rojo)}

/* ---- Modal hoja de recibo ---- */
.modal-fondo{position:fixed;inset:0;background:rgba(17,17,16,.55);z-index:100;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px}
.modal-fondo.abierto{display:flex}
.modal-acciones{max-width:720px;width:100%;display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px}
.modal-acciones .btn{font-size:12.5px;padding:8px 14px}
.btn-cerrar{background:#fff;color:var(--negro)}
.btn-imprimir{background:var(--azul);color:#fff}
.btn-anular{background:var(--rojo-l);color:var(--rojo)}

.hoja{background:#fff;width:100%;max-width:720px;font-family:var(--serif);color:#1a1a18;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.copia{position:relative;padding:26px 46px 20px}
.copia-etiqueta{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:#999;text-align:right}
.hoja-header{text-align:center;margin-bottom:10px}
.hoja-header .nombre{font-size:19px;font-weight:600;letter-spacing:.04em}
.hoja-header .subtitulo{font-style:italic;font-size:12.5px;margin-top:2px}
.hoja-header .direccion{font-size:11px;margin-top:4px;line-height:1.45}
.hoja-hr{border:none;border-top:1.5px solid #1a1a18;margin:10px 0 16px}
.hoja-titulo{text-align:center;font-size:16px;font-weight:600;letter-spacing:.08em;margin-bottom:16px}
.hoja-fecha{margin-bottom:14px;font-size:13.5px}
.hoja-cuerpo{font-size:13.5px;line-height:1.65;text-align:justify;white-space:pre-wrap}
.hoja-cuerpo p{margin-bottom:10px}
.hoja-firma{margin-top:26px;text-align:center;font-size:12.5px}
.hoja-firma .linea{border-top:1px solid #1a1a18;width:210px;margin:0 auto 5px}
.hoja-firma b{display:block;font-size:13px}
.hoja-numero{font-family:var(--mono);font-size:10px;color:#999;text-align:right;margin-bottom:4px}
.hoja-anulado-marca{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-18deg);font-size:38px;font-weight:700;color:rgba(179,56,44,.3);border:4px solid rgba(179,56,44,.3);padding:4px 16px;border-radius:8px;pointer-events:none;letter-spacing:.1em}
.hoja-wrap{position:relative}

.linea-corte{display:flex;align-items:center;gap:8px;padding:0 22px;color:#999}
.linea-corte::before,.linea-corte::after{content:'';flex:1;border-top:1.5px dashed #aaa}
.linea-corte span{white-space:nowrap;font-family:var(--mono);font-size:10.5px;letter-spacing:.05em}

@media print{
  @page{margin:9mm}
  body *{visibility:hidden}
  .hoja-imprimible,.hoja-imprimible *{visibility:visible}
  .hoja-imprimible{position:absolute;top:0;left:0;width:100%;box-shadow:none}
  .modal-acciones{display:none}
  .modal-fondo{position:absolute;background:none;padding:0;display:block;overflow:visible}
  .copia{page-break-inside:avoid}
}
</style>

<script>
const SUPABASE_URL = 'https://dzbbswphrqgmdndtvxzx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_wTeNC3UmYjHsuTQ9LfCWkg_KJDz3C3B';

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

let causaSeleccionada = null; // { id, imputado, caratula, cuij, tribunal, estado }
let recibosActuales = {};
let causasCache = {};

const $ = (id) => document.getElementById(id);
const toastEl = $('toast');
function toast(msg, esError) {
  toastEl.textContent = msg;
  toastEl.className = 'toast mostrar' + (esError ? ' error' : '');
  setTimeout(() => { toastEl.className = 'toast'; }, 3200);
}
function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function hoyART() {
  const d = new Date(Date.now() - 3 * 60 * 60 * 1000);
  return d.toISOString().slice(0, 10);
}

/* ---------- Número a letras (pesos argentinos) ---------- */
const UNIDADES = ['', 'UNO', 'DOS', 'TRES', 'CUATRO', 'CINCO', 'SEIS', 'SIETE', 'OCHO', 'NUEVE'];
const DIEZ_A_DIECINUEVE = ['DIEZ', 'ONCE', 'DOCE', 'TRECE', 'CATORCE', 'QUINCE', 'DIECISÉIS', 'DIECISIETE', 'DIECIOCHO', 'DIECINUEVE'];
const VEINTIS = ['VEINTIUNO', 'VEINTIDÓS', 'VEINTITRÉS', 'VEINTICUATRO', 'VEINTICINCO', 'VEINTISÉIS', 'VEINTISIETE', 'VEINTIOCHO', 'VEINTINUEVE'];
const DECENAS = ['', '', 'VEINTE', 'TREINTA', 'CUARENTA', 'CINCUENTA', 'SESENTA', 'SETENTA', 'OCHENTA', 'NOVENTA'];
const CENTENAS = ['', 'CIENTO', 'DOSCIENTOS', 'TRESCIENTOS', 'CUATROCIENTOS', 'QUINIENTOS', 'SEISCIENTOS', 'SETECIENTOS', 'OCHOCIENTOS', 'NOVECIENTOS'];

function trescientosEnLetras(n) {
  if (n === 0) return '';
  if (n === 100) return 'CIEN';
  let out = '';
  const c = Math.floor(n / 100), resto = n % 100;
  if (c) out += CENTENAS[c] + ' ';
  if (resto >= 10 && resto < 20) {
    out += DIEZ_A_DIECINUEVE[resto - 10];
  } else if (resto >= 21 && resto <= 29) {
    out += VEINTIS[resto - 21];
  } else if (resto === 20) {
    out += 'VEINTE';
  } else if (resto > 20) {
    const d = Math.floor(resto / 10), u = resto % 10;
    out += DECENAS[d];
    if (u) out += ' Y ' + UNIDADES[u];
  } else if (resto > 0) {
    out += UNIDADES[resto];
  }
  return out.trim();
}

// "UNO"/"VEINTIUNO" pierden la "O" final cuando anteceden a MIL/MILLÓN (apócope: "veintiún mil").
function apocopeUn(s) {
  return s.replace(/UNO$/, 'UN');
}

function enteroEnLetras(n) {
  if (n === 0) return 'CERO';
  const millones = Math.floor(n / 1000000);
  const miles = Math.floor((n % 1000000) / 1000);
  const resto = n % 1000;
  let partes = [];
  if (millones) partes.push(millones === 1 ? 'UN MILLÓN' : apocopeUn(trescientosEnLetras(millones)) + ' MILLONES');
  if (miles) partes.push(miles === 1 ? 'MIL' : apocopeUn(trescientosEnLetras(miles)) + ' MIL');
  if (resto) partes.push(trescientosEnLetras(resto));
  return partes.join(' ').trim();
}

function montoEnLetras(monto) {
  const n = Math.round((Number(monto) || 0) * 100) / 100;
  const parteEntera = Math.floor(n);
  const centavos = Math.round((n - parteEntera) * 100);
  let out = 'PESOS ' + enteroEnLetras(parteEntera);
  if (centavos > 0) {
    out += ' CON ' + String(centavos).padStart(2, '0') + '/100';
  }
  return out;
}

function formatearMonto(monto) {
  const n = Number(monto) || 0;
  const partes = n.toFixed(2).split('.');
  partes[0] = partes[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return partes[1] === '00' ? '$' + partes[0] + '.-' : '$' + partes[0] + ',' + partes[1];
}

const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function fechaLarga(fechaISO) {
  const [y, m, d] = fechaISO.split('-').map(Number);
  return `Rosario, Santa Fe, ${d} de ${MESES[m - 1]} de ${y}.`;
}

// Normaliza nombres propios a "Mayúscula Inicial" (p. ej. "juan carlos perez" -> "Juan Carlos Pérez"),
// sin tocar acentos, y dejando en minúscula los conectores ("de", "del", "la"...).
const CONECTORES_NOMBRE = ['de', 'del', 'la', 'las', 'los', 'y'];
function capitalizarNombre(s) {
  return (s || '').trim().replace(/\s+/g, ' ').split(' ').map((palabra, i) => {
    const low = palabra.toLocaleLowerCase('es');
    if (i > 0 && CONECTORES_NOMBRE.includes(low)) return low;
    return low.charAt(0).toLocaleUpperCase('es') + low.slice(1);
  }).join(' ');
}

/* ---------- Composición del texto del recibo ---------- */
const CONCEPTO_TEXTO = {
  anticipo: 'anticipo a cuenta de honorarios profesionales',
  pago_parcial: 'pago parcial de honorarios profesionales',
  pago_total: 'pago total de honorarios profesionales',
  gastos: 'gastos causídicos',
  libre: 'concepto a detallar',
};
const CIERRE_TEXTO = {
  anticipo: 'El presente importe se recibe a cuenta de los honorarios totales que se devenguen por la labor profesional a desarrollarse en dicha causa, sin perjuicio de la liquidación definitiva que corresponda practicar oportunamente.',
  pago_parcial: 'El presente importe se recibe como pago parcial de los honorarios profesionales convenidos, quedando un saldo pendiente de cancelación.',
  pago_total: 'El presente importe cancela en forma total los honorarios profesionales convenidos por la labor desarrollada en dicha causa, sin nada más que reclamar por dicho concepto.',
  gastos: 'El presente importe corresponde a gastos causídicos, sin perjuicio de los honorarios profesionales que correspondan por separado.',
  libre: '',
};

function componerCuerpo() {
  const nombre = capitalizarNombre($('fPagadorNombre').value) || '[NOMBRE DEL PAGADOR]';
  const dni = $('fPagadorDni').value.trim();
  const monto = parseFloat($('fMonto').value) || 0;
  const conceptoTipo = $('fConcepto').value;
  const patrocinado = capitalizarNombre($('fPatrocinado').value);

  let texto = `Recibí del Sr./Sra. ${nombre}${dni ? ', D.N.I. N° ' + dni : ''}, la suma de ${montoEnLetras(monto)} (${formatearMonto(monto)}), en concepto de ${CONCEPTO_TEXTO[conceptoTipo]}`;

  if (patrocinado) {
    texto += ` por la asistencia y patrocinio letrado del Sr./Sra. ${patrocinado}`;
  }

  if (causaSeleccionada) {
    texto += ` en la causa caratulada "${causaSeleccionada.caratula || '[CARÁTULA]'}"`;
    if (causaSeleccionada.cuij) texto += `, CUIJ N° ${causaSeleccionada.cuij}`;
    if (causaSeleccionada.tribunal) texto += `, en trámite ante ${causaSeleccionada.tribunal}`;
    if (causaSeleccionada.estado) texto += `, actualmente en ${causaSeleccionada.estado}`;
  }

  texto += '.';
  return texto;
}

function actualizarPreview() {
  const monto = parseFloat($('fMonto').value) || 0;
  $('montoLetras').textContent = monto ? montoEnLetras(monto) + ' (' + formatearMonto(monto) + ')' : '';
}

let cuerpoTocadoManualmente = false;
let cierreTocadoManualmente = false;
$('fCuerpo').addEventListener('input', () => { cuerpoTocadoManualmente = true; });
$('fCierre').addEventListener('input', () => { cierreTocadoManualmente = true; });

function recomponer() {
  actualizarPreview();
  if (!cuerpoTocadoManualmente) $('fCuerpo').value = componerCuerpo();
  if (!cierreTocadoManualmente) $('fCierre').value = CIERRE_TEXTO[$('fConcepto').value] || '';
}

['fMonto','fPagadorNombre','fPagadorDni','fConcepto','fPatrocinado'].forEach(id => {
  $(id).addEventListener('input', recomponer);
});
$('fConcepto').addEventListener('change', () => { cierreTocadoManualmente = false; recomponer(); });

// Al salir del campo, prolija el nombre a "Mayúscula Inicial" (no mientras se tipea, para no pelear con el cursor).
['fPagadorNombre','fPatrocinado'].forEach(id => {
  $(id).addEventListener('blur', () => {
    const el = $(id);
    if (el.value.trim()) el.value = capitalizarNombre(el.value);
    recomponer();
  });
});

/* ---------- Autocompletar causa (consulta directa a Supabase) ---------- */
let debounceCausa;
$('fCausa').addEventListener('input', () => {
  clearTimeout(debounceCausa);
  causaSeleccionada = null;
  const valor = $('fCausa').value.trim();
  const hintEl = $('causaHint');
  if (!valor) { hintEl.textContent = ''; recomponer(); return; }
  hintEl.textContent = 'Buscando…';
  debounceCausa = setTimeout(async () => {
    const limpio = valor.replace(/[,()%*]/g, ' ').trim();
    if (!limpio) { hintEl.textContent = ''; recomponer(); return; }
    const { data, error } = await db
      .from('causas')
      .select('id,imputado,caratula,cuij,tribunal,estado')
      .or(`imputado.ilike.%${limpio}%,caratula.ilike.%${limpio}%`)
      .limit(1);
    if (error || !data || !data.length) {
      hintEl.textContent = 'Sin causa vinculada (se guarda solo como texto libre)';
      recomponer();
      return;
    }
    causaSeleccionada = data[0];
    hintEl.textContent = '🔗 ' + (causaSeleccionada.imputado || causaSeleccionada.caratula || '');
    recomponer();
  }, 450);
});

/* ---------- Guardar recibo ---------- */
$('formRecibo').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('btnGuardar');
  const nombre = capitalizarNombre($('fPagadorNombre').value);
  const monto = parseFloat($('fMonto').value);
  if (!nombre || !monto) { toast('Completá pagador y monto', true); return; }

  btn.disabled = true;
  btn.textContent = 'Guardando…';
  try {
    const registro = {
      fecha: $('fFecha').value || hoyART(),
      pagador_nombre: nombre,
      pagador_dni: $('fPagadorDni').value.trim() || null,
      monto,
      concepto_tipo: $('fConcepto').value,
      causa_id: causaSeleccionada ? causaSeleccionada.id : null,
      cuerpo_texto: $('fCuerpo').value.trim() || componerCuerpo(),
      cierre_texto: $('fCierre').value.trim(),
    };
    const { data, error } = await db.from('recibos').insert(registro).select().single();
    if (error) throw error;

    toast('Recibo N° ' + data.numero + ' guardado ✅');
    abrirModal(data);
    resetForm();
    cargarHistorial();
  } catch (err) {
    console.error(err);
    toast('Error al guardar: ' + (err.message || err), true);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Guardar y generar recibo';
  }
});

function resetForm() {
  $('formRecibo').reset();
  $('fFecha').value = hoyART();
  causaSeleccionada = null;
  $('causaHint').textContent = '';
  cuerpoTocadoManualmente = false;
  cierreTocadoManualmente = false;
  $('montoLetras').textContent = '';
  $('fCuerpo').value = '';
  $('fCierre').value = '';
}

/* ---------- Modal / hoja imprimible (se emite por duplicado, para cortar) ---------- */
function renderCopia(recibo, etiqueta) {
  const cuerpoHtml = `<p>${escapeHtml(recibo.cuerpo_texto)}</p>` + (recibo.cierre_texto ? `<p>${escapeHtml(recibo.cierre_texto)}</p>` : '');
  const marca = recibo.anulado ? '<div class="hoja-anulado-marca">ANULADO</div>' : '';
  return `
    <div class="copia">
      ${marca}
      <div class="copia-etiqueta">Recibo N° ${String(recibo.numero).padStart(4, '0')} — ${etiqueta}</div>
      <div class="hoja-header">
        <div class="nombre">DR. NÉSTOR ANTENUCCI</div>
        <div class="subtitulo">Abogado — Derecho Penal</div>
        <div class="direccion">
          Virasoro 1164, Rosario, Santa Fe<br>
          T°XLVIII F°118 C.A.R. (ColAbRo)
        </div>
      </div>
      <hr class="hoja-hr">
      <div class="hoja-titulo">RECIBO</div>
      <div class="hoja-fecha">${escapeHtml(fechaLarga(recibo.fecha))}</div>
      <div class="hoja-cuerpo">${cuerpoHtml}</div>
      <div class="hoja-firma">
        <div class="linea"></div>
        <b>Dr. Néstor Antenucci</b>
        Abogado — T°XLVIII F°118 C.A.R.
      </div>
    </div>`;
}

function abrirModal(recibo) {
  const lineaCorte = '<div class="linea-corte"><span>&#9986; cortar aquí</span></div>';
  $('hojaRecibo').innerHTML =
    renderCopia(recibo, 'ORIGINAL (cliente)') +
    lineaCorte +
    renderCopia(recibo, 'DUPLICADO (archivo del profesional)');

  $('btnAnular').textContent = recibo.anulado ? 'Reactivar' : 'Anular';
  $('btnAnular').onclick = () => toggleAnulado(recibo);
  $('modalFondo').classList.add('abierto');
}
$('btnCerrarModal').addEventListener('click', () => $('modalFondo').classList.remove('abierto'));
$('btnImprimir').addEventListener('click', () => window.print());

async function toggleAnulado(recibo) {
  const nuevoEstado = !recibo.anulado;
  const { error } = await db.from('recibos').update({ anulado: nuevoEstado }).eq('id', recibo.id);
  if (error) { toast('No se pudo actualizar', true); return; }
  recibo.anulado = nuevoEstado;
  toast(nuevoEstado ? 'Recibo anulado' : 'Recibo reactivado');
  abrirModal(recibo);
  cargarHistorial();
}

/* ---------- Historial ---------- */
async function cargarHistorial() {
  const cont = $('historial');
  const { data, error } = await db
    .from('recibos')
    .select('id,numero,fecha,pagador_nombre,monto,anulado,causa_id')
    .order('numero', { ascending: false })
    .limit(50);

  if (error) { cont.innerHTML = '<div class="vacio">No se pudo cargar el historial.</div>'; return; }
  if (!data || !data.length) { cont.innerHTML = '<div class="vacio">Todavía no emitiste recibos.</div>'; return; }

  recibosActuales = {};
  data.forEach(r => { recibosActuales[r.id] = r; });

  const causaIds = [...new Set(data.filter(r => r.causa_id).map(r => r.causa_id))];
  if (causaIds.length) {
    const { data: cRows } = await db.from('causas').select('id,imputado,caratula').in('id', causaIds);
    (cRows || []).forEach(c => { causasCache[c.id] = c.imputado || c.caratula || ''; });
  }

  cont.innerHTML = data.map(r => `
    <div class="historial-item ${r.anulado ? 'anulado' : ''}" onclick="abrirRecibo('${r.id}')">
      <div class="hi-num">N° ${String(r.numero).padStart(4, '0')}</div>
      <div class="hi-body">
        <div class="hi-nombre">${escapeHtml(r.pagador_nombre)}${r.anulado ? '<span class="badge-anulado">ANULADO</span>' : ''}</div>
        <div class="hi-meta">${r.fecha}${r.causa_id && causasCache[r.causa_id] ? ' · ' + escapeHtml(causasCache[r.causa_id]) : ''}</div>
      </div>
      <div class="hi-monto">${formatearMonto(r.monto)}</div>
    </div>
  `).join('');
}

async function abrirRecibo(id) {
  const { data, error } = await db.from('recibos').select('*').eq('id', id).single();
  if (error || !data) { toast('No se pudo abrir el recibo', true); return; }
  abrirModal(data);
}

/* ---------- Init ---------- */
$('fFecha').value = hoyART();
cargarHistorial();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
