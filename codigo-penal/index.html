<html lang="es" translate="no">

<link rel="shortcut icon" type="image/png" href="tareas-icon-512.png">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --azul:#1B3A6B; --azul2:#2E5BA8; --azul-l:#EBF1FB;
  --gris:#F4F4F2; --gris2:#E8E8E4; --gris3:#9A9A96;
  --negro:#111110; --blanco:#FAFAF8; --borde:#D8D8D4;
  --rojo:#B3382C; --rojo-l:#FBEAE8;
  --naranja:#C97A1E; --naranja-l:#FBF0DF;
  --verde:#3D7A4E;
  --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
}
html,body{min-height:100%;background:var(--gris);font-family:var(--sans);color:var(--negro);font-size:14px}
body{translate:no}

.topbar{background:var(--azul);display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:2px solid var(--azul2);position:sticky;top:0;z-index:20}
.logo-cuervo{width:30px;height:30px;flex-shrink:0}
.topbar-brand{display:flex;flex-direction:column;line-height:1.15;flex:1;min-width:0}
.topbar-brand b{font-family:var(--mono);font-size:15px;font-weight:600;color:#fff;letter-spacing:.02em}
.topbar-brand span{font-size:11px;color:#8FB0DD}

.main{max-width:720px;margin:0 auto;padding:16px 14px 60px}

.search-wrap{position:sticky;top:58px;z-index:15;background:var(--gris);padding:10px 0 8px}
.search-input{width:100%;border:1px solid var(--borde);border-radius:9px;padding:11px 14px;font-family:var(--sans);font-size:14.5px;color:var(--negro);background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.search-input:focus{outline:none;border-color:var(--azul2);box-shadow:0 0 0 2px var(--azul-l)}

.tabs{display:flex;gap:6px;margin-top:10px}
.tab{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--azul);background:#fff;border:1px solid var(--borde);border-radius:7px;padding:7px 11px;cursor:pointer}
.tab.activo{background:var(--azul);color:#fff;border-color:var(--azul)}
.tab .cont{color:inherit;opacity:.65;margin-left:3px}

.stats-line{font-size:11.5px;color:var(--gris3);margin:10px 2px 4px}

.panel{display:none}
.panel.activo{display:block}

details.libro{background:transparent;margin-bottom:10px}
details.libro>summary{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--azul);padding:8px 2px;cursor:pointer;list-style:none}
details.libro>summary::-webkit-details-marker{display:none}
details.libro>summary::before{content:'▸ ';color:var(--gris3)}
details.libro[open]>summary::before{content:'▾ '}

details.titulo{background:#fff;border:1px solid var(--borde);border-radius:9px;margin-bottom:7px;overflow:hidden}
details.titulo>summary{padding:10px 12px;cursor:pointer;list-style:none;font-size:13px;font-weight:600}
details.titulo>summary::-webkit-details-marker{display:none}
details.titulo>summary .tnum{font-family:var(--mono);color:var(--azul2);margin-right:6px}
details.titulo>summary .tcont{float:right;font-family:var(--mono);font-size:10.5px;color:var(--gris3);font-weight:400}
.titulo-body{border-top:1px solid var(--borde);padding:6px 8px}

details.capitulo{margin-bottom:4px}
details.capitulo>summary{padding:6px 6px;cursor:pointer;list-style:none;font-size:12px;font-weight:600;color:#444;background:var(--gris);border-radius:6px}
details.capitulo>summary::-webkit-details-marker{display:none}
details.capitulo>summary .cnum{font-family:var(--mono);color:var(--azul2);margin-right:5px}
.capitulo-body{padding:4px 2px 2px}

.art-row{border-radius:7px;cursor:pointer}
.art-row:hover{background:var(--azul-l)}
.art-row-head{display:flex;align-items:baseline;gap:8px;padding:7px 8px}
.art-num{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--azul);flex-shrink:0;min-width:52px}
.art-preview{font-size:12.5px;color:#555;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.art-fav-dot{color:var(--naranja);flex-shrink:0;font-size:11px}

.art-body{display:none;padding:4px 8px 14px 8px;border-top:1px dashed var(--borde);margin:0 2px}
.art-body.abierto{display:block}
.art-breadcrumb{font-family:var(--mono);font-size:10px;color:var(--gris3);margin:10px 0 8px;text-transform:uppercase;letter-spacing:.02em}
.art-content{font-size:13.5px;line-height:1.65;color:#222}
.art-content p{margin-bottom:9px}
.art-content b{color:var(--negro)}
.art-content a{color:var(--azul2)}
.art-content span[style*="italic"]{color:#777;font-size:12.5px}
.art-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.art-actions button{font-family:var(--sans);font-size:12px;font-weight:600;border-radius:6px;padding:7px 11px;cursor:pointer;border:1px solid var(--borde);background:#fff;color:var(--negro);display:inline-flex;align-items:center;gap:5px}
.art-actions button:hover{background:var(--gris)}
.art-actions button.activo{background:var(--naranja-l);color:var(--naranja);border-color:var(--naranja)}
.nota-box{margin-top:8px;display:none}
.nota-box.abierto{display:block}
.nota-box textarea{width:100%;border:1px solid var(--borde);border-radius:7px;padding:8px 10px;font-family:var(--sans);font-size:12.5px;resize:vertical;min-height:52px;line-height:1.5}
.nota-box textarea:focus{outline:none;border-color:var(--azul2);box-shadow:0 0 0 2px var(--azul-l)}
.nota-hint{font-size:10.5px;color:var(--gris3);margin-top:3px}

mark{background:var(--naranja-l);color:var(--negro);border-radius:2px;padding:0 1px}

.resultados-list .art-row{background:#fff;border:1px solid var(--borde);margin-bottom:6px}
.resultados-list .art-body{border-top:1px dashed var(--borde)}

.vacio{text-align:center;padding:40px 20px;color:var(--gris3);font-size:13px}
.vacio b{display:block;font-size:14.5px;color:var(--azul);margin-bottom:6px;font-family:var(--mono)}

.antecedentes-list{font-size:12.5px;line-height:1.6;color:#444}
.antecedentes-list p{background:#fff;border:1px solid var(--borde);border-radius:7px;padding:9px 11px;margin-bottom:6px}
.antecedentes-list a{color:var(--azul2)}

.footer-disc{margin-top:26px;padding:14px 14px;background:#fff;border:1px solid var(--borde);border-radius:9px;font-size:11px;color:var(--gris3);line-height:1.6}
.footer-disc b{color:var(--negro)}
.footer-disc a{color:var(--azul2)}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--negro);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:50;max-width:90vw;text-align:center}
.toast.mostrar{opacity:1;transform:translateX(-50%) translateY(-4px)}
</style>
</head>

<div class="main">
  <div class="search-wrap">
    <input type="text" class="search-input" id="buscador" placeholder="Buscar por número de artículo o palabra clave…" autocomplete="off">

      <div class="tab activo" data-tab="indice">Índice</div>

<script>
'use strict';

/* ---------- Estado (favoritos y notas) en localStorage ---------- */
const ESTADO_KEY = 'cp_estado_v1';
function cargarEstado(){
  try{
    const raw = localStorage.getItem(ESTADO_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { favoritos: [], notas: {} };
}
let estado = cargarEstado();
function guardarEstado(){
  try{ localStorage.setItem(ESTADO_KEY, JSON.stringify(estado)); }catch(e){}
}
function esFavorito(id){ return estado.favoritos.includes(id); }
function toggleFavorito(id){
  const i = estado.favoritos.indexOf(id);
  if(i === -1) estado.favoritos.push(id); else estado.favoritos.splice(i,1);
  guardarEstado();
}

/* ---------- Utilidades ---------- */
function normalizar(s){
  return (s||'').normalize('NFKD').replace(/[̀-ͯ]/g,'').toLowerCase();
}
function porId(id){ return CP_ARTICULOS.find(a => a.id === id); }
const INDEX_BY_ID = {};
CP_ARTICULOS.forEach(a => INDEX_BY_ID[a.id] = a);

// Índice de búsqueda precalculado: incluye el texto del artículo y el título/capítulo
// al que pertenece, para que términos "de rúbrica" (ej. "estafa", que solo aparece
// en el nombre del capítulo y no dentro del art. 172) también encuentren resultado.
const SEARCH_INDEX = CP_ARTICULOS.map(a => ({
  a,
  labelNorm: normalizar(a.label),
  textNorm: normalizar(a.text + ' ' + (a.tituloNombre||'') + ' ' + (a.capituloNombre||''))
}));

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function mostrarToast(msg, esError){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('error', !!esError);
  t.classList.add('mostrar');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('mostrar'), 1800);
}

/* ---------- Construcción del árbol Libro > Título > Capítulo ---------- */
function construirArbol(articulos){
  const libros = [];
  let libroActual = null, tituloActual = null, capActual = null;
  for(const a of articulos){
    if(!libroActual || libroActual.nombre !== a.libro){
      libroActual = { nombre: a.libro, titulos: [] };
      libros.push(libroActual);
      tituloActual = null;
    }
    const tKey = a.tituloNum + '|' + a.tituloNombre;
    if(!tituloActual || tituloActual.key !== tKey){
      tituloActual = { key: tKey, num: a.tituloNum, nombre: a.tituloNombre, items: [] };
      libroActual.titulos.push(tituloActual);
      capActual = null;
    }
    if(a.capituloNum || a.capituloNombre){
      const cKey = a.capituloNum + '|' + a.capituloNombre;
      if(!capActual || capActual.key !== cKey){
        capActual = { key: cKey, tipo: 'capitulo', num: a.capituloNum, nombre: a.capituloNombre, articulos: [] };
        tituloActual.items.push(capActual);
      }
      capActual.articulos.push(a);
    } else {
      tituloActual.items.push({ tipo: 'articulo', art: a });
      capActual = null;
    }
  }
  return libros;
}
const ARBOL = construirArbol(CP_ARTICULOS);

/* ---------- Render de una fila de artículo (colapsable) ---------- */
function previewTexto(a){
  const t = a.text.replace(/^ARTICULO\s*\d+[^.\-–—:]*[.\-–—:]\s*/i, '').replace(/^Art[ií]culo\s*\d+[^.\-–—:]*[.\-–—:]\s*/i, '');
  return t.length > 110 ? t.slice(0,110) + '…' : t;
}
function renderArtRow(a){
  const fav = esFavorito(a.id);
  return `<div class="art-row" data-art="${a.id}">
    <div class="art-row-head" data-toggle="${a.id}">
      <span class="art-num">Art. ${escapeHtml(a.label)}</span>
      <span class="art-preview">${escapeHtml(previewTexto(a))}</span>
      ${fav ? '<span class="art-fav-dot">★</span>' : ''}
    </div>
    <div class="art-body"></div>
  </div>`;
}
function renderArtContenido(a){
  const fav = esFavorito(a.id);
  const nota = estado.notas[a.id] || '';
  return `
    <div class="art-breadcrumb">${escapeHtml(a.breadcrumb)}</div>
    <div class="art-content">${a.html}</div>
    <div class="art-actions">
      <button data-accion="fav" data-id="${a.id}" class="${fav?'activo':''}">${fav?'★ En favoritos':'☆ Favorito'}</button>
      <button data-accion="copiar" data-id="${a.id}">📋 Copiar cita</button>
      <button data-accion="nota" data-id="${a.id}">📝 Nota</button>
      <button data-accion="link" data-id="${a.id}">🔗 Copiar enlace</button>
    </div>
    <div class="nota-box">
      <textarea data-nota="${a.id}" placeholder="Anotación personal sobre este artículo…">${escapeHtml(nota)}</textarea>
      <div class="nota-hint">Se guarda automáticamente en este dispositivo.</div>
    </div>`;
}

/* Abre/cierra el cuerpo de un artículo (dentro de la fila .art-row clickeada), generando su contenido la primera vez */
function toggleArticulo(rowEl, forzarAbrir){
  if(!rowEl) return;
  const body = rowEl.querySelector('.art-body');
  if(!body) return;
  const abierto = body.classList.contains('abierto');
  if(abierto && !forzarAbrir){
    body.classList.remove('abierto');
    return;
  }
  if(!body.dataset.cargado){
    const a = porId(rowEl.dataset.art);
    if(!a) return;
    body.innerHTML = renderArtContenido(a);
    body.dataset.cargado = '1';
  }
  body.classList.add('abierto');
  if(forzarAbrir) body.scrollIntoView({behavior:'smooth', block:'center'});
}

/* ---------- Render del Índice (árbol Libro/Título/Capítulo) ---------- */
function renderIndice(){
  const cont = document.getElementById('panelIndice');
  let html = '';
  for(const libro of ARBOL){
    html += `<details class="libro" open><summary>${escapeHtml(libro.nombre)}</summary>`;
    for(const t of libro.titulos){
      const cantidad = contarArticulosTitulo(t);
      const tituloTxt = t.num ? `<span class="tnum">Título ${escapeHtml(t.num)}</span>${escapeHtml(t.nombre||'')}` : escapeHtml(t.nombre||'');
      html += `<details class="titulo"><summary>${tituloTxt}<span class="tcont">${cantidad} art.</span></summary><div class="titulo-body">`;
      for(const item of t.items){
        if(item.tipo === 'capitulo'){
          html += `<details class="capitulo"><summary><span class="cnum">Cap. ${escapeHtml(item.num)}</span>${escapeHtml(item.nombre||'')}</summary><div class="capitulo-body">`;
          for(const a of item.articulos) html += renderArtRow(a);
          html += `</div></details>`;
        } else {
          html += renderArtRow(item.art);
        }
      }
      html += `</div></details>`;
    }
    html += `</details>`;
  }
  cont.innerHTML = html;
}
function contarArticulosTitulo(t){
  let n = 0;
  for(const item of t.items){
    if(item.tipo === 'capitulo') n += item.articulos.length; else n += 1;
  }
  return n;
}

/* ---------- Búsqueda ---------- */
let buscadorTimer = null;
document.getElementById('buscador').addEventListener('input', (e) => {
  clearTimeout(buscadorTimer);
  const q = e.target.value;
  buscadorTimer = setTimeout(() => ejecutarBusqueda(q), 140);
});

function ejecutarBusqueda(q){
  const query = q.trim();
  if(!query){
    cambiarTab('indice');
    return;
  }
  cambiarTab('resultados');
  const qNorm = normalizar(query);
  const soloNumero = /^\d+/.test(query);
  const resultados = [];
  for(const entry of SEARCH_INDEX){
    const { a, labelNorm, textNorm } = entry;
    let score = -1;
    if(labelNorm === qNorm) score = 100;
    else if(soloNumero && labelNorm.startsWith(qNorm)) score = 90;
    else if(labelNorm.includes(qNorm)) score = 80;
    else if(textNorm.includes(qNorm)) score = 50;
    if(score >= 0) resultados.push({ a, score });
  }
  resultados.sort((x,y) => y.score - x.score || x.a.numero - y.a.numero);
  renderResultados(resultados.map(r => r.a), query);
}

function resaltar(texto, query){
  const qNorm = normalizar(query);
  if(!qNorm) return escapeHtml(texto);
  const textoNorm = normalizar(texto);
  const idx = textoNorm.indexOf(qNorm);
  if(idx === -1) return escapeHtml(texto);
  return escapeHtml(texto.slice(0,idx)) + '<mark>' + escapeHtml(texto.slice(idx, idx+query.length)) + '</mark>' + escapeHtml(texto.slice(idx+query.length));
}

function renderResultados(lista, query){
  const cont = document.getElementById('panelResultados');
  if(lista.length === 0){
    cont.innerHTML = `<div class="vacio"><b>Sin resultados</b>No se encontraron artículos para "${escapeHtml(query)}".</div>`;
    return;
  }
  let html = `<div class="resultados-list">`;
  for(const a of lista){
    const fav = esFavorito(a.id);
    html += `<div class="art-row" data-art="${a.id}">
      <div class="art-row-head" data-toggle="${a.id}">
        <span class="art-num">Art. ${escapeHtml(a.label)}</span>
        <span class="art-preview">${resaltar(previewTexto(a), query)}</span>
        ${fav ? '<span class="art-fav-dot">★</span>' : ''}
      </div>
      <div class="art-body" id="body-${a.id}"></div>
    </div>`;
  }
  html += `</div>`;
  cont.innerHTML = html;
}

/* ---------- Favoritos ---------- */
function renderFavoritos(){
  const cont = document.getElementById('panelFavoritos');
  const arts = estado.favoritos.map(porId).filter(Boolean).sort((x,y)=>x.numero-y.numero);
  document.getElementById('contFav').textContent = estado.favoritos.length ? `(${estado.favoritos.length})` : '';
  if(arts.length === 0){
    cont.innerHTML = `<div class="vacio"><b>Sin favoritos</b>Marcá artículos con ★ para tenerlos siempre a mano acá.</div>`;
    return;
  }
  cont.innerHTML = `<div class="resultados-list">${arts.map(renderArtRow).join('')}</div>`;
}

/* ---------- Antecedentes normativos ---------- */
function renderAntecedentes(){
  const cont = document.getElementById('panelAntecedentes');
  const nota = `<div class="stats-line" style="margin-top:0">Historial de reformas incorporado en el texto de Infoleg (leyes que modificaron, incorporaron o derogaron artículos).</div>`;
  const lista = CP_ANTECEDENTES.map(h => `<p>${h}</p>`).join('');
  cont.innerHTML = nota + `<div class="antecedentes-list">${lista}</div>`;
}

/* ---------- Tabs ---------- */
function cambiarTab(nombre){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('activo', t.dataset.tab === nombre));
  document.getElementById('panelIndice').classList.toggle('activo', nombre === 'indice');
  document.getElementById('panelResultados').classList.toggle('activo', nombre === 'resultados');
  document.getElementById('panelFavoritos').classList.toggle('activo', nombre === 'favoritos');
  document.getElementById('panelAntecedentes').classList.toggle('activo', nombre === 'antecedentes');
  if(nombre === 'favoritos') renderFavoritos();
  if(nombre === 'antecedentes' && !document.getElementById('panelAntecedentes').dataset.cargado){
    renderAntecedentes();
    document.getElementById('panelAntecedentes').dataset.cargado = '1';
  }
}
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    if(t.dataset.tab !== 'resultados'){
      document.getElementById('buscador').value = '';
    }
    cambiarTab(t.dataset.tab);
  });
});

/* ---------- Delegación de eventos (toggle, favorito, copiar, nota, link) ---------- */
document.querySelector('.main').addEventListener('click', (e) => {
  const toggleEl = e.target.closest('[data-toggle]');
  if(toggleEl){
    toggleArticulo(toggleEl.closest('.art-row'));
    return;
  }
  const btn = e.target.closest('[data-accion]');
  if(btn){
    const id = btn.dataset.id;
    const a = porId(id);
    if(btn.dataset.accion === 'fav'){
      toggleFavorito(id);
      const fav = esFavorito(id);
      btn.classList.toggle('activo', fav);
      btn.textContent = fav ? '★ En favoritos' : '☆ Favorito';
      const dot = btn.closest('.art-row').querySelector('.art-fav-dot');
      const head = btn.closest('.art-row').querySelector('.art-row-head');
      if(fav && !dot) head.insertAdjacentHTML('beforeend', '<span class="art-fav-dot">★</span>');
      if(!fav && dot) dot.remove();
      if(document.getElementById('panelFavoritos').classList.contains('activo')) renderFavoritos();
    } else if(btn.dataset.accion === 'copiar'){
      const cita = `Art. ${a.label}, Código Penal de la Nación Argentina (Ley 11.179, T.O. 1984 actualizado)\n"${a.text.replace(/\s+/g,' ').trim()}"`;
      copiarAlPortapapeles(cita, 'Cita copiada al portapapeles');
    } else if(btn.dataset.accion === 'link'){
      const url = location.origin + location.pathname + '#' + id;
      copiarAlPortapapeles(url, 'Enlace copiado al portapapeles');
    } else if(btn.dataset.accion === 'nota'){
      btn.closest('.art-row').querySelector('.nota-box').classList.toggle('abierto');
    }
    return;
  }
});

document.querySelector('.main').addEventListener('input', (e) => {
  if(e.target.dataset && e.target.dataset.nota){
    const id = e.target.dataset.nota;
    clearTimeout(e.target._h);
    e.target._h = setTimeout(() => {
      const val = e.target.value.trim();
      if(val) estado.notas[id] = val; else delete estado.notas[id];
      guardarEstado();
    }, 300);
  }
});

function copiarAlPortapapeles(texto, msgOk){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(texto).then(() => mostrarToast(msgOk), () => mostrarToast('No se pudo copiar', true));
  } else {
    const ta = document.createElement('textarea');
    ta.value = texto; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); mostrarToast(msgOk); }catch(e){ mostrarToast('No se pudo copiar', true); }
    ta.remove();
  }
}

/* ---------- Pie de página / fuente ---------- */
function renderFooter(){
  const fecha = (typeof CP_META !== 'undefined' && CP_META.ultimaFechaBO) ? CP_META.ultimaFechaBO : null;
  document.getElementById('footerDisc').innerHTML = `
    <b>Fuente:</b> texto extraído de la publicación de Infoleg del Código Penal de la Nación Argentina
    (Ley 11.179, T.O. 1984 actualizado), según el archivo HTML provisto por el usuario.
    ${fecha ? `Las notas del propio texto registran modificaciones incorporadas hasta al menos el <b>${escapeHtml(fecha.split('-').reverse().join('/'))}</b>.` : ''}
    Este archivo no trae una fecha de corte explícita de Infoleg.
    <b>Verificar siempre la vigencia</b> de cada artículo antes de invocarlo en un escrito
    (<a href="https://servicios.infoleg.gob.ar/infolegInternet/anexos/15000-19999/16546/texact.htm" target="_blank" rel="noopener">ver en Infoleg</a>).`;
}

/* ---------- Inicio ---------- */
document.getElementById('statsLine').textContent = `${CP_ARTICULOS.length} artículos · Libro Primero y Libro Segundo`;
renderIndice();
renderFooter();

if(location.hash && location.hash.length > 1){
  const id = location.hash.slice(1);
  if(INDEX_BY_ID[id]){
    // Expandir el título/capítulo que contiene el artículo, dentro del índice
    const el = document.querySelector(`#panelIndice .art-row[data-art="${CSS.escape(id)}"]`);
    if(el){
      let p = el.parentElement;
      while(p && p !== document.body){
        if(p.tagName === 'DETAILS') p.open = true;
        p = p.parentElement;
      }
      setTimeout(() => { toggleArticulo(el, true); }, 50);
    }
  }
}

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
